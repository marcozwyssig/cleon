# cleon CI. Structurally the same as asbundle's, for the same reasons - and now with a build that
# really builds: it pulls an asbundle bundle (Eclipse + JDK + Ant + Actifsource Enterprise), generates,
# compiles, installs cleon into that bundle and zips the result.
name: ci

on:
  pull_request:
  push:
    branches: [master]
    # BOTH spellings. This repository tags releases WITHOUT the `v` (the only tag here is `0.2.7`),
    # while the workflow only ever listened for `v*` - so the build matrix has never once fired on a
    # tag, and the Windows and macOS cells were never built. Three defects came out of that gap in one
    # day: the POSIX shim on Windows, Ant's 8191-character command line, and the macOS JDK layout.
    #
    # `[0-9]*` matches the scheme actually in use; `v*` stays, so a future `v0.2.8` works too.
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Runner labels to build, comma-separated. Defaults to one Linux cell. Add macos-15,macos-15-intel for macOS (the expensive half), or pass 'all' for every cell."
        type: string
        # Linux-only BY DEFAULT so a dispatch made without thinking is cheap. macOS is roughly eight
        # times a Linux minute, and asbundle's spending limit was reached paying for it to ride along.
        default: "ubuntu-24.04"

permissions:
  contents: read
  packages: write         # PULLS the asbundle bundle, and PUSHES the update site after a green build
  actions: write          # asks the pages workflow to refresh /p2/ with what was just published

jobs:
  # --- fast lane, every push and PR -----------------------------------------------------------------
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # pytest is a TEST dependency and deliberately absent from the orchestrator's requirements.txt;
      # installed alongside the declaration rather than by hand-copying the runtime pins.
      - name: Install dependencies
        run: pip install pytest -r deploy/provision/orchestrator/requirements.txt

      - name: Unit tests
        run: python -m pytest deploy/provision/orchestrator/test/unit/python -v

      # Assembling the CLI resolves every command's `impl`, so a broken manifest or a renamed function
      # fails here rather than at first invocation.
      - name: CLI assembles and every impl resolves
        run: ./cleon.sh help

      # The drift gate. The CLI module is COMMITTED, not built at import, so the manifest and the module
      # can disagree - and a disagreement nobody notices is a command that exists in one place and not
      # the other. `--check` writes nothing and returns 1 on drift, which is what makes "somebody
      # forgot to regenerate" a red step here rather than a surprise at the next invocation.
      - name: Generated CLI module is not stale
        run: ./cleon.sh support tasks generate --check

  # --- which cells to build -------------------------------------------------------------------------
  # The cell table lives here as JSON because it has to be filterable, and the `matrix` context is NOT
  # available in a job-level `if` (`runs-on` gets it, `if` does not - a documented asymmetry).
  plan:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.select.outputs.cells }}
    steps:
      - id: select
        env:
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only != 'all' && inputs.only || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          # A TAG PUSH IS NOT A REASON TO PAY FOR macOS. An empty ONLY means "every cell", which is the
          # right reading of an explicit `all` and the wrong one for a tag: the two macOS cells are the
          # expensive part of this matrix, and asbundle reached this account's spending limit paying for
          # exactly that to ride along automatically. So a tag builds the three cheap cells, and macOS
          # stays a decision someone makes - `only: all`, or the two labels by name.
          #
          # This has never fired: the matrix is gated on `v*` and the only tag in this repository is
          # `0.2.7`. The first `v` tag would have built all five.
          if [ "$EVENT" != "workflow_dispatch" ]; then
            ONLY="ubuntu-24.04,ubuntu-24.04-arm,windows-2025"
          fi
          # Runner labels are PINNED, never `-latest`: `macos-latest` silently moved from Intel to
          # Apple Silicon, which is how three of asbundle's cells came to be missing unnoticed.
          #
          # windows/arm64 is absent on purpose - IBM Semeru publishes no aarch64 JDK for Windows, so
          # the bundle cleon builds against cannot exist there.
          #
          # `timeout` is per cell because a timeout is a COST CAP and the cells do not cost the same.
          cells='[
            {"os":"ubuntu-24.04",    "arch":"x86_64", "shell":"bash","entry":"./cleon.sh","timeout":45},
            {"os":"ubuntu-24.04-arm","arch":"aarch64","shell":"bash","entry":"./cleon.sh","timeout":45},
            {"os":"macos-15-intel",  "arch":"x86_64", "shell":"bash","entry":"./cleon.sh","timeout":60},
            {"os":"macos-15",        "arch":"arm64",  "shell":"bash","entry":"./cleon.sh","timeout":60},
            {"os":"windows-2025",    "arch":"amd64",  "shell":"cmd", "entry":"cleon.cmd","timeout":75}
          ]'
          if [ -n "$ONLY" ]; then
            # An EXACT match against the list, never a substring: "ubuntu-24.04" is a prefix of
            # "ubuntu-24.04-arm", so a substring test would quietly drag the arm cell into every
            # x86-only run - and it would be paid for before anyone noticed.
            cells=$(printf '%s' "$cells" | jq -c --arg only "$ONLY" \
              '($only | split(",") | map(gsub("^ +| +$";""))) as $want
               | [ .[] | select(.os as $o | $want | index($o)) ]')
            [ "$(printf '%s' "$cells" | jq 'length')" -gt 0 ] || {
              echo "::error::the 'only' input matched no cell: $ONLY" >&2; exit 1; }
          else
            cells=$(printf '%s' "$cells" | jq -c .)
          fi
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          printf '%s' "$cells" | jq -r '.[] | "  will build \(.os) (\(.arch)), cap \(.timeout) min"'

  # --- the real build -------------------------------------------------------------------------------
  build:
    needs: plan
    strategy:
      fail-fast: false          # one platform's failure must not hide the others
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Enable git long paths
        shell: bash
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A matrix that quietly runs x86_64 twice is WORSE than one missing a cell: the result looks
      # complete while one platform was never exercised. Assert rather than trust the label.
      - name: Assert this runner is ${{ matrix.arch }}
        shell: bash
        run: |
          actual="$(python -c 'import platform; print(platform.machine().lower())')"
          echo "runner reports: $actual (expected ${{ matrix.arch }})"
          [ "$actual" = "${{ matrix.arch }}" ] || {
            echo "::error::architecture mismatch: expected ${{ matrix.arch }}, got $actual" >&2
            exit 1
          }

      # oras moves the bundle in and out of the registry as an OCI artifact. A container image cannot
      # carry a macOS or Windows bundle, which is why asbundle publishes them this way.
      - uses: oras-project/setup-oras@v1

      # GITHUB_TOKEN needs `packages: read` on the asbundle-bundle package. That package belongs to
      # ANOTHER repository in this account, and GHCR does not grant that automatically: the package's
      # own settings must list this repository. Absent, the pull fails with a 403 naming the package.
      - name: Build the bundle with cleon installed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ${{ matrix.entry }} build

      # ONE cell publishes the update site, and it is the cheapest one. A p2 repository carries no
      # Eclipse and no JDK - the five cells produce five identical ones, so publishing from each would
      # be four pushes overwriting the same tag with the same bytes, and the last one to finish would
      # decide which. Linux/x86_64 is arbitrary but fixed, which is what matters.
      #
      # Then the pages workflow is asked to refresh /p2/. It could listen for this workflow instead, but
      # `workflow_run` fires on every ci completion - including the fast lane that builds nothing - and
      # would republish an unchanged site on every push. Dispatching here fires exactly when there is
      # something new to serve.
      - name: Publish the update site and refresh /p2/
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          ./cleon.sh release publish-updatesite
          gh workflow run pages.yml --ref master

      - name: Upload the combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: cleon-bundle-${{ matrix.os }}-${{ matrix.arch }}
          path: build-out/cleon_*_on_*.zip
          if-no-files-found: error
          retention-days: 7
