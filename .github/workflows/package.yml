name: Package Eclipse for Windows, Linux and MacOS with x86_64 and arm64

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    strategy:
      max-parallel: 1  # This line ensures sequential execution
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          config: |
            core.protectNTFS=false        

      - name: Set up Python (or other environment if needed)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build for ${{ matrix.arch }} architecture
        run: |
          cd "${{ github.workspace }}/build"
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            ./init.sh            
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./init.ps1
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ./init.sh
          fi

          ./myenv/bin/invoke package-eclipse
