# cleon's product website -> GitHub Pages.
#
# On every push to master, not on a tag: the site describes what cleon IS, not which version you can
# download, so it should follow the repository rather than the release. The one page that names a
# version - Getting started - names an example tag, and an example does not go stale the way a claim does.
#
# The site is built by the SAME command a developer runs (`./cleon.sh support site`), which is the
# kernel's Hugo-in-Docker task: no hugo, go or git is installed here, and the runner therefore cannot
# build it differently than a laptop does.
name: pages

on:
  push:
    branches: [master]
    paths:
      # Only when the site or the way it is built changes. A model change does not alter these pages,
      # and rebuilding the site for it would publish an identical artefact on every commit.
      - "site/**"
      - "cleon.yaml"
      - ".github/workflows/pages.yml"
  # ci.yml dispatches this after a green build has published a new update site, which is what keeps
  # /p2/ current: the pages run serves the newest published package, so it has to run after a publish
  # and not only when a page changes.
  workflow_dispatch:

permissions:
  contents: read
  packages: read          # the update site under /p2/ is pulled from GHCR, not rebuilt here
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # docker is on the ubuntu runner already; the Hugo image brings hugo, go and git with it.
      - name: Build the site
        run: ./cleon.sh support site

      # The P2 update site, served under /p2/ so Eclipse can point at a URL instead of a downloaded
      # archive: p2 speaks HTTP and file, not OCI, and this is the only HTTP host cleon has.
      #
      # It comes from the PUBLISHED package rather than from a build here. `cleon build package` needs
      # the base bundle, a compile and a headless Actifsource run - half an hour to reproduce an artefact
      # that already exists, and one that could differ from the one people were told to install.
      #
      # WHAT THIS COSTS, stated where someone might change it: Pages on a public repository is public, so
      # everything unpacked below is readable by anyone. That is deliberate and it stops here. The BUNDLE
      # is not published this way and must not be - it carries Actifsource Enterprise, whose licence is
      # not ours to hand out, so it stays a private package handed over on request. What goes public here
      # is cleon's own features and plugins.
      # `oras` from the action, not from `./cleon.sh support install`. The gate puts its download on the
      # PATH of ITS OWN process, which is right for the kernel's own package operations and useless to
      # the next line of a shell script - measured here as `oras: command not found`, exit 127, one line
      # after the gate reported success. A workflow that calls oras itself has to have it on the job's
      # PATH, and that is what this action is for; cleon's ci.yml already uses it for the same reason.
      - uses: oras-project/setup-oras@v1

      - name: Serve the published update site under /p2/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          # `oras repo tags` lists oldest first, so the last line is the newest publish.
          tag="$(oras repo tags ghcr.io/marcozwyssig/cleon-updatesite | tail -1)"
          echo "serving update site $tag"
          mkdir -p /tmp/p2 build-out/website/p2
          oras pull "ghcr.io/marcozwyssig/cleon-updatesite:$tag" -o /tmp/p2
          unzip -q /tmp/p2/cleon-updatesite_*.zip -d build-out/website/p2
          # A p2 repository without these is not one, and a 200 on a directory listing would hide that.
          test -f build-out/website/p2/site.xml
          test -f build-out/website/p2/content.jar

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-out/website

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
