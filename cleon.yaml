# cleon delivery manifest - the single declarative source the delivery kernel
# (delivery.orchestrator.manifest) assembles cleon's CLI from. Scaffolded by
# `python -m delivery.bootstrap` (netctl#651 strand 4). Fill it in: add your real groups + commands and
# wire each `impl` to a "module:function" your orchestrator package exports.
#
# Sections:
#   product       the product label (shim/manifest name + diagnostics).
#   groups        the ONE command tree: group -> command -> { impl: "module:function", help: "one-line
#                 summary" }. The key order within a group is its membership order; the env-gate is derived.
#   env_groups    the subset of groups that are env-first (`cleon <env> <group> <cmd>`, default below).
#   environments  the deployment env matrix (a backend per env) + the default env.
product: cleon

# --- product build data (read RAW via CONTEXT.manifest_data(), IGNORED by the CLI engine) ---
# The CLI engine reads only groups/env_groups, so cleon's own build parameters live here rather than in
# Python. Everything below is a knob someone may need to turn on a machine I cannot see - a differently
# unpacked bundle, a bigger heap, an Actifsource release that renames a build configuration - and none
# of it should require editing code to turn.
build:
  # WHERE THE BUNDLE COMES FROM. `build fetch-bundle` pulls it from the registry asbundle publishes to
  # and unpacks it here. A developer with a bundle already unpacked can skip that step and point
  # `directory` at their own. Relative paths resolve from the repo root.
  bundle:
    directory: build/bundle
    registry: ghcr.io/marcozwyssig
    repository: asbundle-bundle
    # Empty means "the newest published for this host". Pin it to reproduce an old build - the tag
    # carries the Eclipse and JDK versions, so pinning it pins those too.
    tag: ""
    # Ordered candidates for the Eclipse `plugins` directory inside it, tried in this order. Ordered
    # rather than searched, because the archive root DIFFERS BY HOST: asbundle zips the Eclipse install
    # itself on Linux and Windows, and the folder containing Eclipse.app on macOS. A candidate only
    # counts if it actually holds org.eclipse.equinox.launcher_*.jar.
    plugin_candidates:
      - plugins
      - Eclipse.app/Contents/Eclipse/plugins
      - "*/plugins"
      - "*/Eclipse.app/Contents/Eclipse/plugins"

  # THE ANT RUNS. Both files live in deploy/provision/ per the platform block layout.
  ant:
    generate_file: deploy/provision/asbuild.generate.xml
    package_file: deploy/provision/asbuild.package.xml
    generate_targets: [generate]
    # Compiling uses the SAME build file as packaging - it is the same javac over the same projects,
    # just run earlier and stopping before the jars.
    compile_targets: [compile]
    package_targets: [package]
    # JVM flags for the Ant process, passed via ANT_OPTS. Generation walks 22,000+ generated files;
    # the default heap is where that runs out, halfway through a CI run.
    opts: ["-Xmx4g"]
    # Extra -D properties handed to BOTH build files. The build files declare defaults for these, so an
    # empty map here is a working build - this is the override seam, not a requirement.
    properties:
      cleon.java.target: "21"
      # Turn on to have the generator say what it loaded and why something was not found. Long, but the
      # alternative when a generation fails is guessing - which has cost several CI runs already.
      cleon.generate.verbose: "true"
      # `error` makes any model error fail the build; `warning` reports and continues. Currently
      # `warning`, because the model has one known incompleteness (a Feature under Project Methods ->
      # hermes with no `fullName`) and blocking every release on it is a decision for the model's owner.
      cleon.validate.exceptiontype: "warning"

  # WHAT IS BUILT. The site project is the root of the derivation: it names the features, they name the
  # plugins, and nothing else is compiled (orchestrator/deliverables.py).
  site:
    project: cleon.site
    # The profile the asbundle bundle was assembled with. p2 installs INTO a profile, and naming one
    # that does not exist fails with a message about the profile rather than about cleon.
    profile: SDKProfile
    # Directories under src/ to exclude entirely. The samples are not shipped AND are the only nested
    # projects; they are currently excluded by not being referenced rather than by name, so this is
    # empty on purpose - fill it if a sample ever ends up on the site by accident.
    skip_directories: []

# The ONE command tree, along the CI/CD loop: group -> command -> { impl: "module:function", help }. The
# key order within a group is its membership order. `build` is a single-member group whose member shares its
# name, so it collapses to ONE flat top-level command (`cleon build`); `deploy` is a multi-member
# env-first group (see env_groups). The starter impls point at the generated `orchestrator.cli` callbacks;
# replace them with your own as you add commands.
#
# `build` and `all` are impl-less AGGREGATES (#895/#896): they declare no impl, only `depends_on`, and
# the kernel binds them at assembly time (assemble(step_context=...) in orchestrator/cli.py) to run their
# dependency plan as live-streamed `./cleon.sh <cmd>` steps.
#
# `build` sets `stop_on_failure: true` and `all` leaves it false, and the difference is not cosmetic:
# packaging a failed generation compiles a stale tree and publishes an update site that looks fine, so
# that chain must stop at the first red. Deploy's `all` reports every step instead, which is what you
# want from a status sweep.
# --- what cleon publishes ---------------------------------------------------------------------------
# The combined artefact: an asbundle bundle with cleon already installed, so a user starts with Eclipse,
# Actifsource AND cleon in place and picks up later cleon releases through the normal update mechanism.
release:
  registry: ghcr.io/marcozwyssig
  repository: cleon-bundle

groups:
  build:
    fetch-bundle: { impl: "orchestrator.cli:fetch_bundle",
                   help: "Pull the asbundle bundle for this host from the registry and unpack it." }
    compile:  { impl: "orchestrator.cli:compile",
                help: "Compile the model plugins, so the generator can load their Java functions." }
    generate: { impl: "orchestrator.cli:generate",
                help: "Run Actifsource headless: generate the plugin sources, features and update site, then validate." }
    package:  { impl: "orchestrator.cli:package",
                help: "Compile, jar the plugins and features, and publish the P2 update site." }
    install:  { impl: "orchestrator.cli:install",
                help: "Install the freshly built cleon features into the bundle's Eclipse." }
    bundle:   { impl: "orchestrator.cli:bundle",
                help: "Zip the bundle, now carrying cleon, into a publishable archive." }
    build:    { help: "The whole build: fetch, compile, generate, package, install, zip.",
                depends_on: [fetch-bundle, compile, generate, package, install, bundle],
                stop_on_failure: true }
  release:
    publish:  { impl: "orchestrator.cli:publish",
                help: "Push the combined cleon+Actifsource bundle to the registry." }
  deploy:
    up:   { impl: "orchestrator.cli:up",     help: "Deploy the product to the target environment (placeholder)." }
    down: { impl: "orchestrator.cli:down",   help: "Tear the deployment down (placeholder)." }
    all:  { help: "Run build then deploy up end to end (the build->up dependency plan).",
            depends_on: [build, up], stop_on_failure: false }

# The env-first CD groups: `cleon <env> deploy up` (default env below). Every other group is
# environment-agnostic and rejects an env prefix.
env_groups: [deploy]

# The deployment environment matrix (#15, folded into the one manifest per #651 strand 1): one env per row,
# `backend` decides HOW it is realised (`local` today; add a cloud backend and widen _VALID_BACKENDS in
# environments.py later). A deploy command runs against ONE env, selected env-first; `default` is the
# implicit one.
default: dev
environments:
  dev: { backend: local, description: "Local development environment (the default)." }
