# cleon's product website. Built by `./cleon.sh docs site` (simplon.tasks.site) inside the pinned Hugo
# image, so nobody needs Hugo, Go and Git installed to change a page.
baseURL = "https://marcozwyssig.github.io/cleon/"
title = "cleon"
languageCode = "en"

# Hextra is a Hugo MODULE, not a vendored theme directory: the version lives in cleon.yaml's `site:`
# section, `hugo mod get` writes exactly that pin into go.mod, and a build never silently upgrades it.
[module]
[[module.imports]]
path = "github.com/imfing/hextra"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[menu]
[[menu.main]]
name = "Documentation"
pageRef = "/docs"
weight = 1
[[menu.main]]
name = "GitHub"
url = "https://github.com/marcozwyssig/cleon"
weight = 2

[params]
description = "Actifsource metamodels for architecture, modelling and publishing - shipped as a ready-to-use IDE."

[params.navbar]
displayTitle = true
displayLogo = false

[params.footer]
displayCopyright = false
